<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantryPal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <main>
        <section id="recipePage">
            <button id="returnButton" type="button">Home</button>
            <button id="shuffleButton" type="button">Shuffle</button>
            <button id="copyButton" type="button">Copy Recipe</button><br><br>
            <div id="content" class="dynamic-border">Generating recipe...</div>
            <div id="popup" class="popup">Copied to clipboard!</div>
        </section>
    </main>
    <script src="//cdnjs.cloudflare.com/ajax/libs/validate.js/0.13.1/validate.min.js"></script>
    <script type="module" src="scripts.js"></script>
</body>
</html>
