<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PantryPal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <section id="header">
            <div id="container">
                <div id="titleContainer">
                    <a href="/pp-frontend/index.html" id="home">PANTRYPAL</a>
                </div>
                <div id="optionsContainer">
                    <a href="/pp-frontend/contact.html" id="contact">contact</a>
                    <i class="fa-regular fa-sun" style="display: block;" id="sun"></i>
                    <i class="fa-regular fa-moon" style="display: none;" id="moon"></i>
                </div>
            </div>
        </section>
    </header>
    <main>
        <section id="frontPage">
            <h1 id="titleText1">Create delicious meals with</h1>
            <h1 id="titleText2">AI powered recipe creation</h1>
            <input type="text" class="textBox" id="ingredientTB" name="ingredientTB" placeholder="Enter ingredients">
            <input type="text" class="textBox" id="allergyTB" name="allergyTB" placeholder="Enter food allergies"><br><br>
            <a href="/pp-frontend/recipe.html">
                <button id="submitButton" type="button">Generate Recipe</button><br>
            </a>
            <img id="img" src="images/pantry.png" alt="recipe img">
        </section>
    </main>
    <script src="//cdnjs.cloudflare.com/ajax/libs/validate.js/0.13.1/validate.min.js"></script>
    <script type="module" src="scripts.js"></script>
</body>
</html>
